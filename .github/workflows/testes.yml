name: Testes de conexão

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 10 navegadores em 3 redes emuladas (fibra com P2P, 4G/CGNAT, VPN só 443) + visitante
      - run: node tests/e2e.mjs
